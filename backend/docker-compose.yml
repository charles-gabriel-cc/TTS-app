version: '3.8'

services:
  # Serviço Ollama para modelos locais
  ollama:
    image: ollama/ollama:latest
    container_name: tts-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
    restart: unless-stopped
    networks:
      - tts-network
    # Suporte para GPU (requer NVIDIA Docker runtime)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Serviço Qdrant standalone (opcional - pode usar o integrado)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: tts-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    networks:
      - tts-network

  # Aplicação TTS principal
  tts-app:
    image: charlescc/backend-tts-app:latest
    container_name: tts-app-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # CÓDIGO MONTADO COMO VOLUME (mudanças em tempo real)
      - .:/app
      # Excluir diretórios que não devem ser montados
      - /app/tts-env
      - /app/__pycache__
      - /app/.gradio
      # Volumes para dados
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./data:/app/data
      - ./ccen-docentes:/app/ccen-docentes
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=http://ollama:11434
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
      - USE_LOCAL_COLLECTION=true
      - COLLECTION_NAME=ccen-docentes
      - USE_LOCAL_MODEL=true
      # Configurações CUDA
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
      #Configurações Langsmith
      - LANGSMITH_TRACING=true
      - LANGSMITH_ENDPOINT=https://api.smith.langchain.com
      - LANGSMITH_PROJECT=backend
    depends_on:
      - qdrant
      - ollama
    restart: on-failure
    command: >
      bash -c "
      echo '=== TTS-APP com CUDA 11.8 e Python $$(python --version) ===';
      echo '🔧 Verificando CUDA...';
      nvidia-smi || true;
      echo '⏳ Aguardando Qdrant ficar disponível...';
      until curl -s http://qdrant:6333/health > /dev/null 2>&1; do
        echo '   Qdrant ainda não disponível, aguardando...';
        sleep 2;
      done;
      echo '✅ Qdrant está disponível!';
      echo '⏳ Aguardando Ollama ficar disponível...';
      until curl -s http://ollama:11434/api/tags > /dev/null 2>&1; do
        echo '   Ollama ainda não disponível, aguardando...';
        sleep 3;
      done;
      echo '✅ Ollama está disponível!';
      echo '⏳ Aguardando Redis ficar disponível (tcp/6379)...';
      until bash -c 'echo > /dev/tcp/redis/6379' 2>/dev/null; do
        echo '   Redis ainda não disponível, aguardando...';
        sleep 1;
      done;
      echo '✅ Redis está disponível!';
      echo '📦 Instalando gunicorn/uvicorn/redis (runtime)...';
      python -m pip install -q --no-cache-dir gunicorn uvicorn redis || true;
      echo '🚀 Iniciando Gunicorn com múltiplos workers...';
      exec gunicorn --bind 0.0.0.0:8000 --workers 2 --worker-class uvicorn.workers.UvicornWorker --timeout 120 --keep-alive 5 server:app
      "
    networks:
      - tts-network
    # Suporte para GPU (requer NVIDIA Docker runtime)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  redis:
    image: redis:7-alpine
    container_name: tts-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - tts-network

  # n8n - Automação de workflows
  n8n:
    image: n8nio/n8n:1.109.1
    container_name: tts-n8n
    ports:
      - "15678:5678"
    environment:

      - GENERIC_TIMEZONE=America/Recife
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:15678/
      - N8N_EDITOR_BASE_URL=http://localhost:15678/
      - DB_SQLITE_VACUUM_ON_STARTUP=true
      - NODES_INCLUDE=n8n-nodes-qdrant
    volumes:
      - n8n_data:/home/node/.n8n
      - 'D:/projetos/TTS-app/backend/articles:/articles'
    restart: unless-stopped
    networks:
      - tts-network

volumes:
  qdrant_data:
    driver: local
  ollama_data:
    driver: local
  n8n_data:
    driver: local

networks:
  tts-network:
    driver: bridge 